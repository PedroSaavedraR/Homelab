networks:
  net-frontend:
    driver: bridge
  net-backend:
    driver: bridge

services:
  db-postgres:
    image: postgres:15
    container_name: lab-postgres
    restart: always
    networks:
      - net-backend
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB}
      POSTGRES_USER: ${NEXTCLOUD_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_PASSWORD}
    volumes:
      - ./nextcloud_data:/var/lib/postgresql/data

  nube-nextcloud:
    image: nextcloud:latest
    container_name: lab-nextcloud
    restart: always
    ports:
      - "8080:80"
    networks:
      - net-frontend
      - net-backend
    depends_on:
      - db-postgres
    environment:
      POSTGRES_HOST: db-postgres
      POSTGRES_DB: ${NEXTCLOUD_DB}
      POSTGRES_USER: ${NEXTCLOUD_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_PASSWORD}

  node-exporter:
    image: prom/node-exporter:latest
    container_name: lab-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - net-backend

  prometheus:
    image: prom/prometheus:latest
    container_name: lab-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - net-backend
      - net-frontend
    depends_on:
      - node-exporter

  monitor-grafana:
    image: grafana/grafana-oss:latest
    container_name: lab-grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - net-frontend
    volumes:
      - ./grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

  # Set-up for connection via VPN
  vpn-wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: lab-wireguard
    privileged: true
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      SERVERMODE: server
      SERVERURL: ${WG_SERVERURL}
      SERVERPORT: 51820
      PEERS: 2
      PEERDNS: auto
      ALLOWEDIPS: 0.0.0.0/0
      INTERNAL_SUBNET: 10.13.13.0
      UI_PASSWORD: ${WG_PASSWORD_QR} # Contraseña para ver los códigos QR en web
    volumes:
      - ./wireguard_config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp" # VPN Port
      - "51821:51821/tcp" # Web Interface for QR codes
    networks:
      - net-frontend